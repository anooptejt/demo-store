apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-store
  labels:
    app: demo-store
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  progressDeadlineSeconds: 45
  selector:
    matchLabels:
      app: demo-store
  template:
    metadata:
      labels:
        app: demo-store
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: demo-store
          image: quay.io/anoop_thotapalli/demo-store:pending-ci
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
