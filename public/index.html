<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storefront</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mute:#6e6e73;--line:#e5e5ea;--accent:#0071e3;--ok:#1d8f4e;--bad:#c9342b}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mute:#98989d;--line:#2c2c2e;--accent:#2997ff;--ok:#30d158;--bad:#ff6961}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px max(16px,calc((100vw - 960px)/2));background:var(--card);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:22px;font-weight:650}
.meta{font-size:13px;color:var(--mute)}
main{max-width:960px;margin:0 auto;padding:24px 16px 96px;display:grid;gap:24px;grid-template-columns:1fr}
@media (min-width:820px){main{grid-template-columns:2fr 1fr}}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{margin:0 0 4px;font-size:17px}
.price{font-size:15px}.stock{font-size:13px;color:var(--mute);margin-bottom:12px}
button{font:inherit;border:0;border-radius:980px;padding:8px 16px;background:var(--accent);color:#fff;cursor:pointer}
button[disabled]{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--accent);padding:4px 8px}
aside h2{margin:0 0 12px;font-size:17px}
.line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.total{display:flex;justify-content:space-between;font-weight:650;padding:12px 0}
.empty{color:var(--mute);font-size:15px}
#msg{min-height:24px;font-size:14px;margin-top:8px}.ok{color:var(--ok)}.bad{color:var(--bad)}
</style>
</head>
<body>
<header>
  <h1>Storefront</h1>
  <div class="meta" id="meta">Loading…</div>
</header>
<main>
  <section>
    <div class="grid" id="grid" aria-live="polite"></div>
  </section>
  <aside class="card">
    <h2>Your basket</h2>
    <div id="lines"><p class="empty">Nothing here yet.</p></div>
    <div class="total"><span>Total</span><span id="total">$0.00</span></div>
    <button id="buy" disabled>Place order</button>
    <div id="msg" role="status"></div>
  </aside>
</main>
<script>
const money = (n) => '$' + n.toFixed(2);
const cart = new Map();
let catalog = [];

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || 'Request failed.');
  return body;
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.replaceChildren(...catalog.map((p) => {
    const el = document.createElement('div');
    el.className = 'card';
    const h = document.createElement('h2'); h.textContent = p.name;
    const price = document.createElement('div'); price.className = 'price'; price.textContent = money(p.price);
    const stock = document.createElement('div'); stock.className = 'stock'; stock.textContent = p.stock > 0 ? p.stock + ' in stock' : 'Sold out';
    const add = document.createElement('button'); add.textContent = 'Add';
    add.disabled = p.stock - (cart.get(p.id) || 0) <= 0;
    add.addEventListener('click', () => { cart.set(p.id, (cart.get(p.id) || 0) + 1); renderGrid(); renderCart(); });
    el.append(h, price, stock, add);
    return el;
  }));
}

function renderCart() {
  const lines = document.getElementById('lines');
  let total = 0;
  const rows = [...cart].map(([id, qty]) => {
    const p = catalog.find((x) => x.id === id);
    total += p.price * qty;
    const row = document.createElement('div'); row.className = 'line';
    const label = document.createElement('span'); label.textContent = qty + ' × ' + p.name;
    const rm = document.createElement('button'); rm.className = 'ghost'; rm.textContent = 'Remove';
    rm.addEventListener('click', () => { const n = (cart.get(id) || 0) - 1; n > 0 ? cart.set(id, n) : cart.delete(id); renderGrid(); renderCart(); });
    row.append(label, rm);
    return row;
  });
  if (rows.length) lines.replaceChildren(...rows);
  else { const e = document.createElement('p'); e.className = 'empty'; e.textContent = 'Nothing here yet.'; lines.replaceChildren(e); }
  document.getElementById('total').textContent = money(total);
  document.getElementById('buy').disabled = cart.size === 0;
}

function say(text, kind) {
  const el = document.getElementById('msg');
  el.textContent = text; el.className = kind || '';
}

document.getElementById('buy').addEventListener('click', async () => {
  const btn = document.getElementById('buy');
  btn.disabled = true; say('Placing your order…');
  try {
    const { order } = await api('/api/checkout', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: [...cart].map(([id, quantity]) => ({ id, quantity })) })
    });
    cart.clear();
    say('Order ' + order.id + ' placed. Total ' + money(order.total) + '.', 'ok');
  } catch (err) {
    say(err.message, 'bad');
  }
  await load();
});

async function load() {
  const [{ products }, info] = await Promise.all([api('/api/products'), api('/api/info')]);
  catalog = products;
  document.getElementById('meta').textContent = info.app + ' · v' + info.version + ' · build ' + info.build + ' · pod ' + info.pod;
  renderGrid(); renderCart();
}

load().catch((err) => { document.getElementById('meta').textContent = 'Could not load the store.'; say(err.message, 'bad'); });
</script>
</body>
</html>
